# CULT on Render — web + managed Postgres
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: cult-db
    plan: free
    databaseName: cult
    user: cult

services:
  - type: web
    name: cult-web
    runtime: node
    plan: free
    region: oregon
    # Seed uses process env (DATABASE_URL) — do NOT pass --env-file=.env (file absent on Render)
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm db:push && pnpm db:seed && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: cult-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      # Set after first deploy to https://<service>.onrender.com (or Render sync)
      - key: AUTH_URL
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: BLOB_STORAGE_DIR
        value: /opt/render/project/src/.data/blobs
      - key: BLOB_STORAGE
        value: memory
